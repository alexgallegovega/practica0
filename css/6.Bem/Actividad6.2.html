<div class="comments-section">
    <h2>Comentarios</h2>

    <!-- Conexión con el CSS -->
    <link rel="stylesheet" href="Actividad6.2.css">

    <!-- Lista de comentarios -->
    <div class="comment">
        <div class="comment-author">Alex</div>
        <div class="comment-content">¡Este es un comentario de ejemplo!</div>
        <div class="comment-date">5 de febrero de 2026</div>
    </div>

    <div class="comment">
        <div class="comment-author">Maria</div>
        <div class="comment-content">Otro comentario para mostrar la estructura.</div>
        <div class="comment-date">5 de febrero de 2026</div>
    </div>

    <!-- Formulario para nuevo comentario -->
    <form class="comment-form">
        <input type="text" placeholder="Tu nombre" required>
        <textarea placeholder="Escribe tu comentario..." required></textarea>
        <button type="submit">Enviar</button>
    </form>
</div>
